<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07090d">
    <title>Brain Atlas 2120</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Brain atlas navigation">
        <a class="brand" href="#atlas" aria-label="Brain Atlas 2120 home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <strong id="brandTitle">Brain Atlas</strong>
            <small id="brandSubtitle">psychology + medicine</small>
          </span>
        </a>

        <nav class="page-nav" aria-label="Pages">
          <a class="nav-link" href="#atlas" data-route="atlas"><iconify-icon icon="mdi:brain" aria-hidden="true"></iconify-icon><span>Atlas</span></a>
          <a class="nav-link" href="#neurons" data-route="neurons"><iconify-icon icon="mdi:dna" aria-hidden="true"></iconify-icon><span>Neurons</span></a>
          <a class="nav-link" href="#study" data-route="study"><iconify-icon icon="mdi:notebook" aria-hidden="true"></iconify-icon><span>Study Board</span></a>
        </nav>

        <div class="search-box">
          <label id="partSearchLabel" for="partSearch"><iconify-icon icon="mdi:magnify" aria-hidden="true"></iconify-icon> Find a structure</label>
          <input id="partSearch" type="search" autocomplete="off" placeholder="frontal, memory, vision">
        </div>

        <div class="part-list-heading">
          <span id="structuresLabel">Structures</span>
          <span id="partCount">0</span>
        </div>
        <div id="partsList" class="parts-list" role="list"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p id="eyebrow" class="eyebrow">Interactive neuroanatomy</p>
            <h1 id="pageTitle">3D Brain Structure Atlas</h1>
          </div>
          <div class="topbar-controls">
            <div class="language-switcher" aria-label="Language switcher">
              <button class="lang-btn is-active" type="button" data-lang="en">EN</button>
              <button class="lang-btn" type="button" data-lang="ka">KA</button>
            </div>
            <div class="topbar-actions" aria-label="Atlas view controls">
              <button class="control-btn is-active" type="button" data-view="full" title="Show the full brain">Full</button>
              <button class="control-btn" type="button" data-view="half" title="Open a sagittal half view">Half</button>
              <button class="control-btn" type="button" data-view="inside" title="Fade cortex and reveal internal parts">Inside</button>
              <button class="control-btn" type="button" data-view="split" title="Separate the major structures">Split</button>
            </div>
          </div>
        </header>

        <section id="atlasScreen" class="atlas-screen">
          <div class="stage-panel">
            <canvas id="brainCanvas" aria-label="Interactive 3D brain model"></canvas>
            <img id="brainRender" class="brain-render" src="./assets/brain-render.png" alt="Realistic 3D render of a human brain">
            <div id="brainHotspots" class="brain-hotspots" aria-label="Clickable brain regions"></div>
            <div id="labelLayer" class="label-layer" aria-hidden="true"></div>
            <div id="brainCallout" class="brain-callout" aria-live="polite"></div>
            <div class="scan-overlay" aria-hidden="true"></div>
            <div class="model-status">
              <span class="status-dot"></span>
              <span id="modelStatus">Loading neural display</span>
            </div>
            <div class="legend-card" aria-label="Selected structure">
              <span id="legendAccent" class="legend-accent"></span>
              <div>
                <small id="selectedLabel">Selected</small>
                <strong id="legendTitle">Frontal Lobe</strong>
              </div>
            </div>
          </div>

          <section id="infoDock" class="info-dock" aria-live="polite"></section>
        </section>

        <section id="articleScreen" class="article-screen" hidden></section>
      </main>
    </div>

    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/package/build/three.module.js",
          "three/addons/": "./vendor/three/package/examples/jsm/"
        }
      }
    </script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
